<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <style>
        .button {
            height: 104px;
            border: none;
            background-image: url("/sources/sprite-botones-estados.png");
            background-color: none;
            font-size: 0;
        }

        .button-inicio {
            width: 268px;
            background-position: -11px -8px;
        }

        .button-categorias {
            width: 434px;
            background-position: -11px -132px;
        }

        .button-eventos {
            width: 352px;
            background-position: -11px -256px;
        }

        .button-sobre {
            width: 568px;
            background-position: -11px -380px;
        }
    </style>
</head>

<body>
    <button class="button button-inicio">Inicio</button>
    <button class="button button-categorias">Categorías</button>
    <button class="button button-eventos">Eventos</button>
    <button class="button button-sobre">Sobre nosotros</button>

</body>
</html>
